questions:
  - id: ktct-002
    type: single
    q: Chức năng thước đo giá trị của tiền tệ có nghĩa là?
    options:
      - Tiền dùng để mua hàng hoặc trả nợ
      - Tiền được rút khỏi quá trình lưu thông và được cất giữ nhằm cất trữ của cải
      - Tiền dùng làm trung gian trong trao đổi hàng hóa
      - Tiền dùng để đo lường giá trị của các hàng hóa khác
    answer: 3
    why: Chức năng thước đo giá trị là tiền được sử dụng để đo lường giá trị của các hàng hóa khác. Đáp án A, C là chức năng phương tiện lưu thông; B là chức năng cất trữ của cải.
    tags:
      - phan-i
      - goc-cau-2
      - nhat-tri
  - id: ktct-034
    type: single
    q: Chức năng phương tiện lưu thông của tiền tệ có nghĩa là?
    options:
      - Tiền dùng làm phương tiện thúc đẩy lưu thông hàng hóa
      - Tiền dùng để mua hàng hoặc trả nợ
      - Tiền dùng để đo lường giá trị của các hàng hóa khác
      - Tiền được rút khỏi quá trình lưu thông và được cất giữ nhằm cất trữ của cải
    answer: 0
    why: 'Phương tiện lưu thông là chức năng tiền làm môi giới trong trao đổi theo công thức H-T-H, nhờ đó thúc đẩy lưu thông hàng hoá. Bẫy rất nặng ở phương án B: ''mua hàng hoặc trả nợ'' chính là chức năng phương tiện thanh toán, và điều này được xác nhận ngay trong bộ đề vì câu 76 hỏi về chức năng phương tiện thanh toán cũng dùng đúng cụm từ đó làm đáp án. C là thước đo giá trị, D là phương tiện cất trữ.'
    tags:
      - phan-i
      - goc-cau-34
      - phan-xu
  - id: ktct-035
    type: single
    q: 'Quy luật giá trị yêu cầu việc sản xuất và trao đổi hàng hóa phải được tiến hành dựa trên:'
    options:
      - Hao phí lao động xã hội
      - Các quy định của nhà nước về đấu thầu
      - Các quy định của nhà nước về đấu giá
      - Hao phí lao động cá biệt
    answer: 0
    why: Quy luật giá trị yêu cầu sản xuất và trao đổi dựa trên hao phí lao động xã hội (socially necessary labor time), không phải quy định nhà nước hay lao động cá biệt.
    tags:
      - phan-i
      - goc-cau-35
      - nhat-tri
  - id: ktct-041
    type: single
    q: Ưu thế của nền kinh tế thị trường là?
    options:
      - Luôn đảm bảo công bằng xã hội tuyệt đối
      - Loại trừ nguy cơ khủng hoảng kinh tế
      - Tạo động lực cho sự sáng tạo của các chủ thể kinh tế
      - Loại trừ được cạnh tranh không lành mạnh
    answer: 2
    why: Ưu thế của nền kinh tế thị trường là tạo động lực cho sự sáng tạo và cải tiến của các chủ thể kinh tế thông qua cơ chế cạnh tranh. A, B, D không đúng.
    tags:
      - phan-i
      - goc-cau-41
      - nhat-tri
  - id: ktct-049
    type: single
    q: Dịch vụ không có đặc điểm nào ?
    options:
      - Không thể cất trữ
      - Việc sản xuất và tiêu dùng được diễn ra đồng thời
      - Tính đồng nhất
      - Tính vô hình
    answer: 2
    why: Dịch vụ không có đặc điểm tính đồng nhất. Dịch vụ có tính chất vô hình, không thể cất trữ, sản xuất và tiêu dùng đồng thời, và tính riêng lẻ/khác biệt từng lần.
    tags:
      - phan-i
      - goc-cau-49
      - nhat-tri
  - id: ktct-052
    type: single
    q: Chức năng phương tiện cất trữ của tiền tệ có nghĩa là?
    options:
      - Tiền dùng để mua hàng hoặc trả nợ
      - Tiền dùng để đo lường giá trị của các hàng hóa khác
      - Tiền dùng làm phương tiện thúc đẩy lưu thông hàng hóa
      - Tiền được rút khỏi quá trình lưu thông và được cất giữ nhằm cất trữ của cải
    answer: 3
    why: Chức năng cất trữ của tiền là khi tiền được rút khỏi quá trình lưu thông để cất giữ giá trị. Các phương án khác mô tả các chức năng khác của tiền (phương tiện lưu thông, thước đo giá trị, phương tiện thanh toán).
    tags:
      - phan-i
      - goc-cau-52
      - nhat-tri
  - id: ktct-053
    type: single
    q: 'Chọn đáp án đúng nhất: Các loại thị trường cơ bản ở Việt Nam phân theo đối tượng trao đổi gồm:'
    options:
      - Thị trường hàng hoá vàdịch vụ; Thị trường lao động; Thị trường công nghệ; thị trường yếu tố sản xuất
      - Thị trường hàng hoá tiêu dùng thông thường; thị trường công nghệ; Thị trường hàng hoá sức lao động; thị trường bất động sản
      - Thị trường Thị trường vốn; thị trường công nghệ; Thị trường hàng hoá sức lao động; thị trường bất động sản
      - Thị trường hàng hoá tiêu dùng thông thường; Thị trường vốn; thị trường công nghệ; thị trường bất động sản
    answer: 1
    why: 'Danh mục chuẩn các loại thị trường cơ bản ở Việt Nam có 5 loại: thị trường hàng hoá tiêu dùng thông thường, thị trường vốn (tài chính), thị trường hàng hoá sức lao động, thị trường khoa học - công nghệ và thị trường bất động sản; không phương án nào của đề nêu đủ cả 5, nên đề thiếu phương án chuẩn. Phương án A phải loại trước vì trộn tiêu chí phân loại khác: đã tách riêng ''thị trường lao động'', ''thị trường công nghệ'' rồi lại thêm ''thị trường yếu tố sản xuất'' vốn bao trùm chính hai thị trường đó. Trong ba phương án còn lại, B giữ được cặp đối lập đúng thuật ngữ kinh tế chính trị là ''hàng hoá tiêu dùng thông thường'' với ''hàng hoá sức lao động'' (hàng hoá đặc biệt) nên gần văn bản gốc nhất; C bỏ mất thị trường hàng hoá tiêu dùng, D bỏ mất thị trường sức lao động là thị trường không thể thiếu.'
    tags:
      - phan-i
      - goc-cau-53
      - phan-xu
      - de-co-van-de
  - id: ktct-059
    type: single
    q: Một trong những khuyết tật của kinh tế thị trường là?
    options:
      - Thiếu hụt hàng hóa công cộng
      - Tối ưu hóa phân bổ nguồn lực
      - Hạn chế đổi mới sáng tạo
      - Tự do hóa thương mại và đầu tư
    answer: 0
    why: Khuyết tật của kinh tế thị trường là không cung cấp đủ hàng hóa công cộng (công cộng), vì thị trường chỉ quan tâm đến lợi nhuận. B, C, D là lợi ích hoặc đặc điểm của thị trường, không phải khuyết tật.
    tags:
      - phan-i
      - goc-cau-59
      - nhat-tri
  - id: ktct-062
    type: single
    q: Cơ chế thị trường hoạt động dựa trên nguyên tắc nào sau đây?
    options:
      - Kế hoạch hóa tập trung
      - Phân phối thu nhập công bằng
      - Các doanh nghiệp nhà nước chiếm thị phần khống chế trong tất cả các ngánh
      - Tự do cạnh tranh, giá cả do thị trường quyết định
    answer: 3
    why: Cơ chế thị trường hoạt động dựa trên nguyên tắc tự do cạnh tranh và giá cả do thị trường quyết định. D là định nghĩa cơ bản của cơ chế thị trường.
    tags:
      - phan-i
      - goc-cau-62
      - nhat-tri
  - id: ktct-070
    type: single
    q: Yếu tố nào sau đây là cốt lõi trong xây dựng giá trị của một thương hiệu?
    options:
      - Quảng cáo, tiếp thị
      - Quy mô kinh doanh
      - Chất lượng của sản phẩm/dịch vụ
      - Bao bì, hình thức của sản phẩm/dịch vụ
    answer: 2
    why: Chất lượng sản phẩm/dịch vụ là yếu tố cốt lõi tạo giá trị thương hiệu, duy trì niềm tin khách hàng. Quảng cáo, bao bì chỉ là biểu hiện bên ngoài.
    tags:
      - phan-i
      - goc-cau-70
      - nhat-tri
  - id: ktct-076
    type: single
    q: Chức năng phương tiện thanh toán của tiền có nghĩa là?
    options:
      - Tiền dùng để đo lường giá trị của các hàng hóa khác
      - Tiền dùng để mua hàng hoặc trả nợ
      - Tiền dùng làm phương tiện thúc đẩy lưu thông hàng hóa
      - Tiền được rút khỏi quá trình lưu thông và được cất giữ nhằm cất trữ của cải
    answer: 1
    why: Chức năng phương tiện thanh toán của tiền là dùng để mua hàng hoặc trả nợ. B chính xác, D là chức năng cất trữ.
    tags:
