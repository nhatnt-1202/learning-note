  - id: ktct-080
    type: single
    q: Khi đồng thời tăng năng suất lao động và cường độ lao động lên 2 lần thì ý nào sau đây là đùng ?
    options:
      - Tổng số hàng hóa tăng 2 lần, tổng lượng giá trị tăng 2 lần
      - Tổng giá trị hàng hóa tăng 2 lần, giá trị 1 đơn vị hàng hóa không thay đổi
      - Tổng giá trị hàng hóa tăng 2 lần, giá trị 1 đơn vị hàng hóa giảm 2 lần
      - Tổng số hàng hóa tăng 4 lần, tổng lượng giá trị tăng 4 lần
    answer: 2
    why: 'Khi cả năng suất lao động (×2) và cường độ lao động (×2) tăng 2 lần: tổng hàng hóa ×4 nhưng tổng giá trị ×2 (do cường độ). Giá trị mỗi đơn vị = 2V/(4Q) = V/(2Q), giảm 2 lần.'
    tags:
      - phan-i
      - goc-cau-80
      - nhat-tri
