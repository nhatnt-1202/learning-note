    type: single
    q: 'Hình thái giá trị ban đầu trong trao đổi hàng hóa là:'
    options:
      - Hình thái giá trị ngẫu nhiên
      - Hình thái giá trị đầy đủ
      - Hình thái tiền
      - Hình thái giá trị chung
    answer: 0
    why: Hình thái giá trị ban đầu là hình thái ngẫu nhiên, khi hai hàng hóa được trao đổi bình thường lần đầu tiên. Sau đó là hình thái đầy đủ, chung, rồi tiền tệ.
    tags:
