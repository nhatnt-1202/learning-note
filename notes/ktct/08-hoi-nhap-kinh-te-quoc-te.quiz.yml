  - id: ktct-097
    type: single
    q: 'Lựa chọn các từ thích hợp dưới đây để điền vào chỗ chấm: Nền kinh tế độc lập, tự chủ là nền kinh tế không bị …(1)…., phụ thuộc vào nước khác, người khác hoặc vào một tổ chức kinh tế nào đó về đường lối, chính sách phát triển, không bị bất cứ ai dùng những điều kiện kinh tế, tài chính, thương mại, viện trợ…để …(2)……, khống chế làm tổn hại …(3)….. quốc gia và …(4)…. cơ bản của dân tộc.'
    options:
      - khống chế; áp đặt; lợi ích; chủ quyền.
      - khống chế; chi phối; lợi ích; chủ quyền.
      - lệ thuộc; áp đặt; chủ quyền; lợi ích.
      - lệ thuộc; chi phối; chủ quyền; lợi ích.
    answer: 2
    why: 'Nguyên văn giáo trình: nền kinh tế độc lập, tự chủ là nền kinh tế không bị LỆ THUỘC, phụ thuộc vào nước khác... không bị bất cứ ai dùng những điều kiện kinh tế, tài chính, thương mại, viện trợ để ÁP ĐẶT, khống chế, làm tổn hại CHỦ QUYỀN quốc gia và LỢI ÍCH cơ bản của dân tộc. Hai dấu hiệu nhận biết: chỗ (1) phải ghép được với ''phụ thuộc'' ngay sau nó nên là ''lệ thuộc''; chỗ (2) phải khác với ''khống chế'' đứng liền sau nên là ''áp đặt''. Bẫy ở B là đảo thứ tự thành ''lợi ích quốc gia'' và ''chủ quyền của dân tộc'', vốn sai cách kết hợp từ.'
