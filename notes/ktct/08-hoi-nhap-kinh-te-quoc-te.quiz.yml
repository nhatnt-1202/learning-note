  - id: ktct-024
    type: single
    q: 'Chủ trương trong quan hệ quốc tế của Việt Nam là:'
    options:
      - Việt Nam muốn là bạn, là đối tác của các nước trong cộng đồng quốc tế
      - Việt Nam sẵn sàng là bạn của các nước trong cộng đồng quốc tế
      - Việt Nam sẵn sàng là bạn, là đối tác tin cậy của các nước trong cộng đồng quốc tế
      - Việt Nam sẵn sàng là bạn tin cậy của các nước trong cộng đồng quốc tế
    answer: 2
    why: Chủ trương chính thức của Việt Nam trong quan hệ quốc tế là sẵn sàng là bạn, là đối tác tin cậy (không phải bạn thôi hay đối tác thôi). C là công thức đầy đủ và chính xác.
    tags:
      - phan-i
      - goc-cau-24
      - nhat-tri
  - id: ktct-029
    type: single
    q: 'Chọn đáp án đúng nhất về nội dung hội nhập kinh tế quốc tế:'
    options:
      - Thực hiện đa dạng hoá các hình thức hội nhập kinh tế quốc tế.
      - Chuẩn bị các điều kiện để thực hiện hội nhập hiệu quả, thành công.
      - Hội nhập kinh tế quốc tế là phương thức phát triển phổ biến của các nước, nhất là các nước đang và kém phát triển trong điều kiện hiện nay.
      - Các nước đang và kém phát triển cần phải có chiến lược hợp lý, tìm kiếm các đối sách phù hợp để thức ứng với quá trình toàn cầu hoá.
    answer: 1
    why: 'Phần ''nội dung hội nhập kinh tế quốc tế'' của giáo trình chỉ gồm hai việc: thứ nhất chuẩn bị các điều kiện để thực hiện hội nhập hiệu quả, thành công; thứ hai thực hiện đa dạng các hình thức, các mức độ hội nhập. C và D không thuộc phần nội dung mà thuộc phần tính tất yếu khách quan của hội nhập, nên loại ngay. Giữa A và B thì B là câu chữ nguyên văn và là bước tiền đề được nêu trước, còn A bị sửa thành ''đa dạng hoá các hình thức'' và bỏ mất vế ''các mức độ'' nên chỉ đúng một phần; đề hỏi ''đúng nhất'' nên chốt B, nhưng cần lưu ý A cũng là một nội dung thật (xem câu 101 phần II, đáp án gộp cả hai vế).'
    tags:
      - phan-i
      - goc-cau-29
      - phan-xu
      - can-nguoi-doc-lai
  - id: ktct-031
    type: single
    q: 'Chọn đáp án đúng: Câu nói: “Toàn cầu hoá không tốt, không xấu. Nó có sức mạnh để đem lại vô số điều tốt” là của ai?'
    options:
      - Josehp E. Stiglitz
      - Thomas Friedman
      - P.A. Samuelson
      - V.I. Lênin
    answer: 0
    why: 'Câu này trích từ Joseph E. Stiglitz trong ''Globalization and Its Discontents'': ''Toàn cầu hoá tự nó không tốt cũng không xấu. Nó có sức mạnh đem lại vô số điều tốt.'' Bẫy là Thomas Friedman vì ông nổi tiếng hơn về đề tài toàn cầu hoá với ''Thế giới phẳng'', nhưng Friedman viết theo hướng ca ngợi thế giới phẳng chứ không phải câu trung tính hai mặt này; chính Stiglitz, người phê phán mặt trái của toàn cầu hoá, mới nhấn mạnh rằng kết quả tuỳ thuộc cách quản trị.'
    tags:
      - phan-i
      - goc-cau-31
      - phan-xu
  - id: ktct-047
    type: single
    q: 'Chọn đáp án đúng về xây dựng chiến lược và lộ trình hội nhập kinh tế phù hợp:'
    options:
      - Về chủ thể tham gia hội nhập, Nhà nước là một chủ thể quan trọng nhưng không phải là duy nhất
      - Vấn đề tranh thủ thời cơ, vượt qua thách thức trong hội nhập quốc tế là vấn đề cần đặc biệt coi trọng.
      - Đánh giá được những điều kiện khách quan, chủ quan có ảnh hưởng đến hội nhập kinh tế của nước ta. Cần làm rõ vị trí của Việt Nam để xác định khả năng và điều kiện để có thể hội nhập.
      - Việt Nam không thể đứng ngoài dòng chảy của lịch sử, hội nhập quốc tế không chỉ là “khẩu hiệu thời thượng” mà phải là “phương thức tồn tại và phát triển” của nước ta hiện nay.
    answer: 2
    why: 'Trong mục ''xây dựng chiến lược và lộ trình hội nhập kinh tế phù hợp'', giáo trình liệt kê: đánh giá đúng bối cảnh quốc tế; đánh giá các điều kiện khách quan và chủ quan ảnh hưởng đến hội nhập, làm rõ vị trí của Việt Nam để xác định khả năng và điều kiện hội nhập; nghiên cứu kinh nghiệm các nước; xây dựng phương hướng, mục tiêu, giải pháp; xác định lộ trình hợp lý. C là nguyên văn ý thứ hai. A, B, D đều nằm ở mục trước đó là ''nhận thức sâu sắc về thời cơ và thách thức do hội nhập đem lại'', nên dù nội dung đúng nhưng sai mục mà đề hỏi.'
    tags:
      - phan-i
      - goc-cau-47
      - phan-xu
  - id: ktct-054
    type: single
    q: 'Chọn khái niệm đúng nhất về toàn cầu hoá:'
    options:
      - Toàn cầu hoá là sự phụ thuộc lẫn nhau ngày càng tăng giữa các quốc gia trên quy mô toàn cầu.
      - Toàn cầu hoá là quá trình tạo ra sự phụ thuộc lẫn nhau ngày càng tăng giữa các quốc gia trên quy mô toàn cầu.
      - Toàn cầu hoá là quá trình tạo ra liên kết ngày càng tăng giữa các quốc gia trên quy mô toàn cầu.
      - Toàn cầu hoá là quá trình tạo ra liên kết và sự phụ thuộc lẫn nhau ngày càng tăng giữa các quốc gia trên quy mô toàn cầu.
    answer: 3
    why: 'Toàn cầu hóa không chỉ là sự phụ thuộc mà còn là quá trình tạo ra liên kết ngày càng tăng. D là khái niệm đầy đủ nhất, tích hợp cả hai yếu tố: quá trình, liên kết và phụ thuộc lẫn nhau.'
    tags:
      - phan-i
      - goc-cau-54
      - nhat-tri
  - id: ktct-060
    type: single
    q: Xu thế toàn cầu hóa là gì?
    options:
      - Sự liên kết văn hóa
      - Sự độc quyền của một nước trên thế giới
      - Sự phát triển độc lập của mỗi quốc gia
      - Quá trình gia tăng sự phụ thuộc lẫn nhau giữa các quốc gia về kinh tế, chính trị, văn hóa, xã hội
    answer: 3
    why: 'Xu thế toàn cầu hóa bao gồm tất cả các lĩnh vực: kinh tế, chính trị, văn hóa, xã hội. D là định nghĩa toàn diện nhất, A chỉ là một khía cạnh.'
