questions:
  - id: ktct-007
    type: single
    q: 'Chọn đáp án đúng nhất về tác động tích cực của hội nhập kinh tế quốc tế:'
    options:
      - Hội nhập kinh tế quốc tế tạo điều kiện mở rộng thị trường, tiếp thu khoa học - công nghệ, vốn, chuyển dịch cơ cấu kinh tế trong nước.
      - Hội nhập kinh tế quốc tế gia tăng sự phụ thuộc do nợ nước ngoài, tình trạng bất bình đẳng trương trao đổi mậu dich.
      - Hội nhập kinh tế quốc tế tạo ra nhiều cơ hội việc làm mới và nâng cao mức thu nhập tương đối của các tầng lớp dân cư.
      - Hội nhập kinh tế quốc tế giúp mở cửa thị trường, thu hút vốn, thúc đẩy công nghiệp hoá, tăng tích luỹ.
    answer: 0
    why: Tác động tích cực chủ yếu của hội nhập kinh tế quốc tế là mở rộng thị trường, tiếp thu khoa học công nghệ, thu hút vốn và chuyển dịch cơ cấu kinh tế. A là phương án đúng nhất, bao quát hơn C, D.
    tags:
      - phan-i
      - goc-cau-7
      - nhat-tri
  - id: ktct-013
    type: single
    q: 'Chọn đáp án đúng: Trong điều kiện toàn cầu hoá kinh tế, hội nhập kinh tế quốc tế trở thành tất yếu khách quan vì:'
    options:
      - Sự phát triển của khoa học - công nghệ làm cho mọi nền kinh tế trở nên độc lập hoàn toàn
      - Toàn cầu hoá kinh tế đã lôi cuốn tất cả các nước vào hệ thống phân công lao động quốc tế
      - Các quốc gia ngày càng có nhu cầu hợp tác để tận dụng lợi thế của nhau
      - Các quốc gia đều muốn mở rộng lãnh thổ và chiếm lĩnh thị trường thế giới
    answer: 1
    why: Nguyên nhân khách quan của hội nhập là toàn cầu hoá kinh tế đã lôi cuốn tất cả các nước vào hệ thống phân công lao động quốc tế, tạo thành tất yếu khách quan. A sai (lôi cuốn vào phụ thuộc), C, D là nguyên nhân chủ quan.
    tags:
      - phan-i
      - goc-cau-13
      - nhat-tri
  - id: ktct-016
    type: single
    q: Giá trị thương hiệu quốc gia của Việt Nam năm 2024 xếp thứ bao nhiêu trong số 193 quốc gia được đánh giá ?
    options:
      - '32'
      - '30'
      - '33'
      - '31'
    answer: 0
    why: Theo báo cáo Brand Finance Nation Brands 2024, giá trị thương hiệu quốc gia Việt Nam đạt khoảng 507 tỷ USD, xếp thứ 32 trong 193 quốc gia được đánh giá, tăng một bậc so với hạng 33 của năm 2023. Phương án D (31) là số liệu không có thật, còn C (33) là thứ hạng của năm trước chứ không phải năm 2024.
    tags:
