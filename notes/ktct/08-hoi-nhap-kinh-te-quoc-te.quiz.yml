  - id: ktct-071
    type: single
    q: 'Chọn đáp án đúng nhất về biện pháp trọng tâm để xây dựng thành công nền kinh tế độc lập, tự chủ đi đôi với tích cực hội nhập kinh tế quốc tế:'
    options:
      - Hoàn thiện, bổ sung đường lối kinh tế, xây dựng và phát triển đất nước.
      - Đẩy mạnh công nghiệp hoá, hiện đại hoá đất nước.
      - Đẩy mạnh quan hệ đối ngoại và chủ động hội nhập kinh tế quốc tế đáp ứng yêu cầu và lợi ích của đất nước.
      - Tăng cường năng lực cạnh tranh của nền kinh tế bằng hoàn thiện thể chế kinh tế, hành chính, đặc biệt là tăng cường ứng dụng khoa học – công nghệ hiện đại
    answer: 1
    why: 'Giáo trình nêu năm biện pháp xây dựng nền kinh tế độc lập, tự chủ, trong đó ghi rõ đẩy mạnh công nghiệp hoá, hiện đại hoá là nhiệm vụ trọng tâm nhằm xây dựng cơ sở vật chất cho chủ nghĩa xã hội, giúp đi tắt đón đầu, tránh tụt hậu. Chính bộ đề này tự xác nhận: câu 98 phần II hỏi ''nhiệm vụ nào được coi là nhiệm vụ trọng tâm... giúp Việt Nam đi tắt, đón đầu'' và đáp án là đẩy mạnh công nghiệp hoá, hiện đại hoá. Phương án D (tăng năng lực cạnh tranh qua thể chế và khoa học - công nghệ) chỉ là biện pháp thứ tư, cần thiết nhưng mang tính điều kiện, không phải biện pháp trọng tâm.'
