questions:
  - id: ktct-001
    type: single
    q: 'Vai trò của cách mạng công nghiệp đối với phát triển là:'
    options:
      - Thúc đẩy phát triển lực lượng sản xuất
      - Bảo tồn văn hóa
      - Ổn định dân số
      - Giảm cạnh tranh
    answer: 0
    why: Vai trò chính của cách mạng công nghiệp là thúc đẩy phát triển lực lượng sản xuất thông qua cơ khí hoá, tự động hoá, làm tăng năng suất lao động. Các phương án khác (văn hoá, dân số, cạnh tranh) không phải là vai trò kinh tế trực tiếp.
    tags:
      - phan-i
      - goc-cau-1
      - nhat-tri
  - id: ktct-003
    type: single
    q: 'Chọn đáp án đúng: Cho đến nay có mấy mô hình công nghiệp hoá đã được triển khai thực hiện?'
    options:
      - '3'
      - '4'
      - '2'
      - '1'
    answer: 0
    why: 'Đề hỏi số MÔ HÌNH CÔNG NGHIỆP HOÁ, không phải số cuộc cách mạng công nghiệp. Giáo trình nêu 3 mô hình tiêu biểu: mô hình công nghiệp hoá cổ điển (Anh, Tây Âu), mô hình kiểu Liên Xô (cũ) và mô hình của Nhật Bản cùng các nước công nghiệp mới NICs. Bẫy là phương án B (4) vì người học nhớ nhầm sang bốn cuộc cách mạng công nghiệp 1.0 đến 4.0.'
    tags:
      - phan-i
      - goc-cau-3
      - phan-xu
  - id: ktct-017
    type: single
    q: Các quốc gia có dịch vụ chiếm tỷ trọng lớn trong GDP thường thuộc nhóm nào ?
    options:
      - Nhóm các quốc gia phát triển
      - Nhóm các quốc gia công nghiệp mới
      - Nhóm các quốc gia có trình độ phát triển kinh tế khá
      - Nhóm các quốc gia có trình độ phát triển kinh tế thấp
    answer: 0
    why: Các quốc gia phát triển có dịch vụ chiếm tỷ trọng lớn trong GDP (60-80%), vì nền kinh tế các nước này chuyển dịch sang dịch vụ. Các nước đang phát triển còn có tỷ trọng cao từ nông nghiệp và công nghiệp.
    tags:
      - phan-i
      - goc-cau-17
      - nhat-tri
  - id: ktct-018
    type: single
    q: Cách mạng khoa học và công nghệ hiện đại ảnh hưởng đến chủ nghĩa tư bản như thế nào?
    options:
      - Thúc đẩy phát triển lực lượng sản xuất, hình thành nền kinh tế tri thức, thay đổi cơ cấu ngành
      - Làm suy thoái nền kinh tế
      - Giảm nhu cầu về lao động trí óc
      - Gây ra lạm phát
    answer: 0
    why: Cách mạng khoa học công nghệ hiện đại thúc đẩy phát triển lực lượng sản xuất, hình thành nền kinh tế tri thức, thay đổi cơ cấu ngành kinh tế. B, C, D là những tác động tiêu cực hoặc không chính xác.
    tags:
      - phan-i
      - goc-cau-18
      - nhat-tri
  - id: ktct-025
    type: single
    q: 'Chọn đáp án đúng: Cách mạng công nghiệp lần thứ nhất diễn ra bắt đầu từ ngành sản xuất nào?'
    options:
      - Ngành công nghiệp đường sắt
      - Ngành công nghiệp cơ khí chế tạo
      - Ngành công nghiệp khai khoáng (than, quặng sắt)
      - Ngành công nghiệp dệt
    answer: 3
    why: Cách mạng công nghiệp lần thứ nhất bắt đầu từ ngành dệt ở Anh (vào cuối thế kỷ XVIII), với các phát minh như máy kéo sợi (spinning frame). Các ngành khác phát triển sau.
    tags:
      - phan-i
      - goc-cau-25
      - nhat-tri
