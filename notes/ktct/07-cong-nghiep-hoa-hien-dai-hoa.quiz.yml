  - id: ktct-102
    type: single
    q: 'Chọn đáp án sai về nội dung: “Sẵn sàng thích ứng với tác động của bối cảnh cuộc Cách mạng công nghiệp lần thứ tư”?'
    options:
      - Nắm bắt và đẩy mạnh việc ứng dụng những thành tựu của cách mạng công nghiệp lần thứ tư.
      - Hoàn thiện thể chế, xây dựng nền kinh tế dựa trên nền tảng đổi mới, sáng tạo.
      - Cho phép ứng dụng những thành tựu khoa học - công nghệ mới, hiện đại vào các ngành, các vùng và các lĩnh vực của nền kinh tế.
      - Chuẩn bị các điều kiện cần thiết để ứng phó với những tác động tiêu cực của Cách mạng công nghiệp lần thứ tư.
    answer: 2
    why: 'Đề hỏi đáp án SAI. Mục ''sẵn sàng thích ứng với tác động của bối cảnh cách mạng công nghiệp lần thứ tư'' có đúng ba nội dung: hoàn thiện thể chế, xây dựng nền kinh tế dựa trên nền tảng đổi mới sáng tạo (B); nắm bắt và đẩy mạnh việc ứng dụng thành tựu của cách mạng công nghiệp lần thứ tư (A); chuẩn bị các điều kiện cần thiết để ứng phó với tác động tiêu cực của nó (D). Phương án C bị lấy từ mục nội dung công nghiệp hoá, hiện đại hoá nói chung và còn bị sửa thành ''cho phép ứng dụng'', một cách diễn đạt xin - cho, thụ động, trái tinh thần chủ động thích ứng. Bẫy là D: nghe có vẻ bị động nên dễ bị chọn nhầm, nhưng đó là nội dung nguyên văn.'
    tags:
      - phan-ii
      - goc-cau-1
      - phan-xu
  - id: ktct-107
    type: single
    q: Chọn đáp án sai về vai trò của cách mạng công nghiệp lần thứ nhất đối với sự phát triển của Chủ nghĩa tư bản?
    options:
      - Củng cố, hoàn thiện quan hệ sản xuất tư bản chủ nghĩa.
      - Quyết định sự thống trị của chủ nghĩa tư bản.
      - Chuyển biến từ sản xuất nhỏ, thủ công, phân tán lên sản xuất lớn, tập trung, hiện đại.
      - Nâng cao năng suất lao động xã hội.
    answer: 1
    why: Câu hỏi yêu cầu chọn đáp án SAI. Các phương án A, C, D đều đúng về vai trò của cách mạng công nghiệp lần 1. Phương án B về 'quyết định sự thống trị' cũng về cơ bản đúng nhưng cách diễn đạt hơi tuyệt đối.
    tags:
      - phan-ii
      - goc-cau-6
      - nhat-tri
  - id: ktct-109
    type: single
    q: Đường lối công nghiệp hóa ở nước ta lần đầu tiên được đề ra ở Đại hội nào của Đảng?
    options:
      - Đại hội III
      - Đại hội VI
      - Đại hội IV
      - Đại hội V
    answer: 0
    why: 'Đường lối công nghiệp hóa xã hội chủ nghĩa được Đảng đề ra lần đầu tại Đại hội III (tháng 9/1960), xác định công nghiệp hóa là nhiệm vụ trung tâm của thời kỳ quá độ ở miền Bắc. Bẫy là chữ ''lần đầu tiên'': Đại hội IV (1976) chỉ tiếp tục đường lối đó trên phạm vi cả nước sau thống nhất, còn Đại hội VI (1986) là mốc đổi mới tư duy về công nghiệp hóa chứ không phải nơi khai sinh đường lối.'
    tags:
      - phan-ii
      - goc-cau-8
      - phan-xu
  - id: ktct-116
    type: single
    q: 'Chọn đáp án đúng nhất về vai trò của cách mạng công nghiệp đối với thúc đẩy đổi mới phương thức quản trị phát triển của doanh nghiệp:'
    options:
      - Các doanh nghiệp cần phải xây dựng chiến lược kinh doanh từ nguồn lực công nghệ, trí tuệ, đổi mới, sáng tạo.
      - Các doanh nghiệp cần phải xây dựng chiến lược kinh doanh xuất phát từ nguồn lực, trong đó, nguồn lực chủ yếu là công nghệ, trí tuệ, đổi mới, sáng tạo.
      - Các doanh nghiệp cần phải xây dựng chiến lược trong đó, nguồn lực chủ yếu là công nghệ, trí tuệ, đổi mới, sáng tạo.
      - Các doanh nghiệp cần phải xuất phát từ nguồn lực, trong đó, nguồn lực chủ yếu là công nghệ, trí tuệ, đổi mới, sáng tạo.
    answer: 1
    why: 'Đáp án B đầy đủ nhất: doanh nghiệp phải xây dựng chiến lược dựa trên nguồn lực, với nguồn lực chủ yếu là công nghệ, trí tuệ, đổi mới, sáng tạo. Các phương án khác hoặc chưa đầy đủ hoặc thiếu rõ ràng.'
    tags:
      - phan-ii
      - goc-cau-15
      - nhat-tri
  - id: ktct-125
    type: single
    q: 'Chọn đáp án đúng về vai trò của cách mạng công nghiệp đối với thúc đẩy đổi mới phương thức quản trị phát triển của chính phủ:'
    options:
      - Việc quản lý quá trình sản xuất của các doanh nghiệp trở lên dễ dàng hơn thông qua ứng dụng các công nghệ như internet.
      - Phương thức quản trị, điều hành của chính phủ cũng có sự thay đổi nhanh chóng để thích ứng với sự phát triển của công nghệ mới, hình thành hệ thống tin học hóa trong quản lý và “chính phủ điện tử”.
      - Tạo cơ hội cho các nước phát triển nhiều ngành kinh tế và những ngành mới thông qua ứng dụng những thành tựu về công nghệ thông tin.
      - Chuyển biến từ sản xuất nhỏ, thủ công, phân tán lên sản xuất lớn, tập trung, hiện đại.
    answer: 1
    why: Vai trò của cách mạng công nghiệp với phương thức quản trị chính phủ là làm thay đổi nhanh chóng phương thức quản lý để thích ứng với công nghệ mới, hình thành chính phủ điện tử.
    tags:
