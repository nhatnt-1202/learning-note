  - id: ktct-084
    type: single
    q: 'Chọn đáp án đúng: Các nước chậm phát triển hiện nay có thể thực hiện công nghiệp hoá bằng con đường nào sau đây?'
    options:
      - Tiếp nhận chuyển giao hoàn toàn công nghệ hiện đại từ các nước phát triển.
      - Tập trung phát triển nông nghiệp thuần tuý, không chú trọng công nghiệp và công nghệ.
      - Thông qua tự nghiên cứu, chế tạo để phát triển công nghệ từ trình độ thấp tới trình độ cao.
      - Xây dựng chiến lược phát triển khoa học công nghệ nhiều tầng, kết hợp cả công nghệ truyền thống với công nghệ hiện đại
    answer: 3
    why: Các nước chậm phát triển cần chiến lược đa tầng kết hợp công nghệ truyền thống và hiện đại. D là con đường thực tế nhất, A là quá lý tưởng.
    tags:
      - phan-i
      - goc-cau-84
      - nhat-tri
  - id: ktct-086
    type: single
    q: 'Chọn đáp án đúng: Chiến lược thực hiện công nghiệp hoá của Nhật Bản và các nước NIC được gọi là gì?'
    options:
      - Chiến lược công nghiệp hoá hướng ngoại.
      - Chiến lược công nghiệp hoá rút ngắn dựa trên mục tiêu hướng về xuất khẩu, phát triển sản xuất trong nước thay thế nhập khẩu.
      - Chiến lược công nghiệp hoá kiểu mới thích ứng với những biến đổi của cách mạng công nghiệp lần thứ tư.
      - Chiến lược công nghiệp hoá phát triển sản xuất trong nước thay thế nhập khẩu.
    answer: 1
    why: Giáo trình gọi con đường của Nhật Bản và các nước công nghiệp mới là chiến lược công nghiệp hoá rút ngắn, đẩy mạnh xuất khẩu đồng thời phát triển sản xuất trong nước thay thế hàng nhập khẩu, nhờ tận dụng thành tựu khoa học - công nghệ của các nước đi trước nên chỉ mất vài chục năm. Phương án A ('hướng ngoại') và D ('thay thế nhập khẩu') mỗi cái chỉ nêu một vế của chiến lược kết hợp, và 'hướng ngoại' cũng không phải thuật ngữ giáo trình dùng cho mô hình này.
    tags:
      - phan-i
      - goc-cau-86
      - phan-xu
  - id: ktct-090
    type: single
    q: Đâu là một trong những thành công nổi bật của công nghiệp hóa, hiện đại hóa ở Việt Nam?
    options:
      - Nông nghiệp lạc hậu
      - Chuyển dịch cơ cấu kinh tế theo hướng công nghiệp, dịch vụ, tăng trưởng kinh tế cao
      - Giảm vai trò của kinh tế thị trường
      - Gia tăng bao cấp
    answer: 1
    why: Thành công nổi bật là chuyển dịch cơ cấu kinh tế từ nông nghiệp sang công nghiệp, dịch vụ, với tăng trưởng kinh tế cao. B chính xác.
    tags:
