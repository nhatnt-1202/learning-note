  - id: ktct-091
    type: single
    q: Một thách thức lớn về nguồn nhân lực khi công nghiệp hóa, hiện đại hóa là?
    options:
      - Thừa lao động
      - Thiếu hụt lao động chất lượng cao và cơ cấu lao động chưa phù hợp
      - Dân số già hóa
      - Lao động giá rẻ
    answer: 1
