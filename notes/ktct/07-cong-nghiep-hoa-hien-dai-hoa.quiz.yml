    type: single
    q: 'Cuộc cách mạng công nghiệp lần thứ ba gắn với sự phát triển của:'
    options:
      - Giao thông vận tải
      - Viễn thông
      - Công nghệ thông tin và máy tính
      - Truyền hình
    answer: 2
    why: Cách mạng công nghiệp lần thứ ba (cuối thế kỷ 20) gắn với sự phát triển của công nghệ thông tin và máy tính, không phải giao thông hay viễn thông.
    tags:
