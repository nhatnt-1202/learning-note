  - id: ktct-137
    type: single
    q: 'Chọn đáp án đúng nhất: Lý do khách quan Việt Nam phải thực hiện công nghiệp hoá, hiện đại hoá:'
    options:
      - Lý luận và thực tiễn cho thấy, công nghiệp hoá là quy luật phổ biến của sự phát triển lực lượng sản xuất xã hội
      - Công nghiệp hoá là quy luật của sự phát triển lực lượng sản xuất xã hội mà mọi quốc gia đều trải qua dù ở các quốc gia phát triển sớm hay các quốc gia đi sau
      - Lý luận và thực tiễn cho thấy, công nghiệp hoá là quy luật mà mọi quốc gia đều trải qua dù ở các quốc gia phát triển sớm hay các quốc gia đi sau
      - Lý luận và thực tiễn cho thấy, công nghiệp hoá là quy luật phổ biến của sự phát triển lực lượng sản xuất xã hội mà mọi quốc gia đều trải qua dù ở các quốc gia phát triển sớm hay các quốc gia đi sau
    answer: 3
    why: 'Phương án D đầy đủ nhất: công nghiệp hoá là quy luật phổ biến của phát triển lực lượng sản xuất, mà mọi quốc gia đều trải qua dù phát triển sớm hay muộn. Đây là lý do khách quan.'
    tags:
      - phan-ii
      - goc-cau-36
      - nhat-tri
  - id: ktct-138
    type: single
    q: 'Chọn đáp án sai về vai trò của cách mạng công nghiệp đối với thúc đẩy lực lượng sản xuất:'
    options:
      - Việc quản lý quá trình sản xuất của các doanh nghiệp trở lên dễ dàng hơn thông qua ứng dụng các công nghệ như internet.
      - Về đối tượng lao động, đưa sản xuất của con người vượt quá giới hạn về tài nguyên thiên nhiên cũng như sự phụ thuộc của sản xuất và nguồn năng lượng truyền thống.
      - Về tư liệu lao động, máy móc ra đời thay thế cho lao động thủ công.
      - Về người lao động, tạo điều kiện thúc đẩy phát triển nguồn nhân lực.
    answer: 0
    why: 'Vai trò thúc đẩy lực lượng sản xuất thể hiện ở ba yếu tố: tư liệu lao động (máy móc thay lao động thủ công), đối tượng lao động (vượt giới hạn tài nguyên và năng lượng truyền thống) và người lao động (phát triển nguồn nhân lực). Phương án A nói về quản lý sản xuất nên thuộc vai trò đổi mới phương thức quản trị, đặt vào đây là sai.'
    tags:
      - phan-ii
      - goc-cau-37
      - nhat-tri
  - id: ktct-148
    type: single
    q: 'Chọn đáp án sai trong số các đáp án về thực hiện các nhiệm vụ để chuyển đổi nền sản xuất – xã hội lạc hậu sang nền sản xuất – xã hội hiện đại:'
    options:
      - Đẩy mạnh ứng dụng những thành tựu của khoa học - công nghệ mới, hiện đại.
      - Công nghiệp hoá, hiện đại hoá gắn với phát triển kinh tế tri thức.
      - Từng bước hoàn thiện quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất.
      - Chuyển dịch cơ cấu kinh tế theo hướng hiện đại, hợp lý và hiệu quả.
    answer: 1
    why: 'Đề hỏi ý SAI. Nhóm ''thực hiện các nhiệm vụ để chuyển đổi nền sản xuất - xã hội lạc hậu sang hiện đại'' trong giáo trình gồm đúng ba việc: đẩy mạnh ứng dụng thành tựu khoa học - công nghệ mới, hiện đại (A); chuyển dịch cơ cấu kinh tế theo hướng hiện đại, hợp lý, hiệu quả (D); từng bước hoàn thiện quan hệ sản xuất phù hợp trình độ lực lượng sản xuất (C). ''Công nghiệp hóa, hiện đại hóa gắn với phát triển kinh tế tri thức'' là một quan điểm/đặc điểm của công nghiệp hóa ở Việt Nam, không nằm trong danh mục ba nhiệm vụ này nên B là đáp án phải chọn.'
    tags:
      - phan-ii
      - goc-cau-47
      - phan-xu
  - id: ktct-151
    type: single
    q: Chọn đáp án sai về đặc điểm của công nghiệp hoá, hiện đại hoá ở Việt Nam?
    options:
      - Công nghiệp hoá, hiện đại hoá theo định hướng xã hội chủ nghĩa, thực hiện mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh.
      - Đẩy mạnh ứng dụng những thành tựu của khoa học – công nghệ mới, hiện đại.
      - Công nghiệp hoá, hiện đại hoá trong điều kiện nền kinh tế thị trường định hướng xã hội chủ nghĩa.
      - Công nghiệp hoá, hiện đại hoá gắn với phát triển kinh tế tri thức.
    answer: 1
    why: Câu hỏi yêu cầu chọn ý SAI về đặc điểm công nghiệp hoá Việt Nam. Các phương án A, C, D đều đúng. Phương án B là một nhiệm vụ nhưng có thể không phải đặc điểm riêng biệt của Việt Nam.
    tags:
      - phan-ii
      - goc-cau-50
      - nhat-tri
  - id: ktct-152
    type: single
    q: Đáp án nào là định nghĩa đúng về nền kinh tế tri thức?
    options:
      - Nền kinh tế tri thức là nền kinh tế trong đó sự sản sinh ra, phổ cập và sử dụng tri thức giữ vai trò quyết định nhất đối với sự phát triển kinh tế, tạo ra của cải, nâng cao chất lượng cuộc sống.
      - Nền kinh tế tri thức là nền kinh tế trong đó tri thức giữ vai trò quyết định nhất đối với sự phát triển kinh tế, tạo ra của cải, nâng cao chất lượng cuộc sống.
      - Nền kinh tế tri thức là nền kinh tế trong đó sự phổ cập và sử dụng tri thức giữ vai trò quyết định nhất đối với sự phát triển kinh tế, tạo ra của cải, nâng cao chất lượng cuộc sống.
      - Nền kinh tế tri thức là nền kinh tế trong đó sự sản sinh và sử dụng tri thức giữ vai trò quyết định đối với sự phát triển kinh tế, tạo ra của cải, nâng cao chất lượng cuộc sống.
    answer: 0
    why: Nền kinh tế tri thức là nền kinh tế trong đó sự sản sinh, phổ cập và sử dụng tri thức giữ vai trò quyết định đối với phát triển kinh tế, tạo ra của cải và nâng cao chất lượng cuộc sống. Phương án A đầy đủ nhất.
    tags:
      - phan-ii
      - goc-cau-51
      - nhat-tri
  - id: ktct-166
    type: single
    q: Đâu là tiêu chuẩn cơ bản để xác định phương án phát triển, lựa chọn dự án đầu tư và công nghệ trong quá trình công nghiệp hoá, hiện đại hoá?
    options:
      - Tăng năng suất lao động
      - Hiệu quả kinh tế - xã hội
      - Nâng cao đời sống nhân dân.
      - Kết hợp kinh tế với an ninh, quốc phòng
    answer: 1
    why: Tiêu chuẩn cơ bản là hiệu quả kinh tế - xã hội, bao gồm cả tăng năng suất lao động, nâng cao đời sống, và kết hợp với an ninh quốc phòng.
    tags:
      - phan-ii
      - goc-cau-65
      - nhat-tri
  - id: ktct-175
    type: single
    q: 'Chọn đáp án đúng: Cho đến nay lịch sử loài người đã và đang trải qua mấy cuộc cách mạng công nghiệp?'
    options:
      - '4'
      - '3'
      - '1'
      - '2'
    answer: 0
    why: 'Lịch sử loài người đã và đang trải qua 4 cuộc cách mạng công nghiệp: cơ khí hoá, điện - cơ khí, điện tử - tin học, và trí tuệ nhân tạo - tự động hoá thông minh.'
    tags:
      - phan-ii
      - goc-cau-74
      - nhat-tri
  - id: ktct-177
    type: single
    q: 'Chọn đáp án sai về đặc điểm của kinh tế tri thức:'
    options:
      - Các ngành kinh tế đựa vào tri thức, dựa vào các thành tựu mới nhất của khoa học – công nghệ ngày càng chiếm đa số.
      - Cơ cấu kinh tế cho phép khai thác, phân bổ và phát huy hiệu quả các nguồn lực trong nước, thu hút có hiệu quả các nguồn lực bên ngoài
      - Tri thức trở thành lực lượng sản xuất trực tiếp, là vốn quý nhất, là nguốn lực quan trọng hàng đầu.
      - Công nghệ thông tin được ứng dụng rộng rãi trong mọi lĩnh vực và thiết lập mạng thông tin đa phương tiện phủ khắp cả nước.
    answer: 1
    why: Câu này yêu cầu chọn đáp án SAI. Phương án B (hiệu quả trong phân bổ nguồn lực) không phải là đặc điểm định nghĩa kinh tế tri thức, mà là hệ quả của các đặc điểm khác.
    tags:
      - phan-ii
      - goc-cau-76
      - nhat-tri
  - id: ktct-179
    type: single
    q: Mục tiêu chiến lược của Việt Nam đến giữa thế kỷ XXI là gì?
    options:
      - Trở thành nước phát triển, theo định hướng XHCN
      - Trở thành nước phát triển, theo định hướng TBCN
      - Trở thành nước phát triển có thu nhập trung bình cao
      - Trở thành cường quốc công nghiệp
    answer: 0
    why: Mục tiêu chiến lược của Việt Nam đến giữa thế kỷ XXI là trở thành nước phát triển theo định hướng XHCN. Đây là mục tiêu chính thức được đề ra.
    tags:
      - phan-ii
      - goc-cau-78
      - nhat-tri
  - id: ktct-180
    type: single
    q: Chọn đáp án sai về vai trò của cách mạng công nghiệp lần thứ hai đối với sự phát triển của Chủ nghĩa tư bản?
    options:
      - Nâng cao năng suất lao động xã hội.
      - Chuyển nền sản xuất cơ khí sang nền sản xuất điện – cơ khí và sang giai đoạn tự động hoá cục bộ trong sản xuất.
      - Phân công lao động, chuyên môn hoá sản xuất được ứng dụng rộng dãi trong các doanh nghiệp.
      - Chuyển nền sản xuất cơ khí sang nền sản xuất tự động hoá toàn diện các khâu của sản xuất.
    answer: 3
    why: Câu này yêu cầu chọn đáp án SAI. Phương án D sai vì cách mạng công nghiệp lần thứ hai (từ cuối 1800s) chỉ dẫn đến tự động hoá cục bộ, không phải toàn diện.
    tags:
      - phan-ii
      - goc-cau-79
      - nhat-tri
  - id: ktct-182
    type: single
    q: 'Chọn đáp án đúng về chuẩn bị các điều kiện cần thiết để ứng phó với những tác động tiêu cực của Cách mạng công nghiệp lần thứ tư:'
    options:
      - Các ngành kinh tế đựa vào tri thức, dựa vào các thành tựu mới nhất của khoa học – công nghệ ngày càng chiếm đa số.
      - Hoàn thiện thể chế, xây dựng nền kinh tế dựa trên nền tảng đổi mới, sáng tạo.
      - Công nghiệp hoá, hiện đại hoá gắn với phát triển kinh tế tri thức.
      - Đẩy mạnh công nghiệp hoá, hiện đại hoá nông nghiệp, nông thôn
    answer: 3
    why: 'Trong giáo trình, ''chuẩn bị các điều kiện cần thiết để ứng phó với những tác động tiêu cực của cách mạng công nghiệp lần thứ tư'' là đầu mục thứ ba, bên dưới liệt kê các nhiệm vụ cụ thể, trong đó có ''đẩy mạnh công nghiệp hóa, hiện đại hóa nông nghiệp, nông thôn'' cùng với xây dựng hạ tầng công nghệ thông tin, phát triển công nghiệp mũi nhọn, phát triển nguồn nhân lực. Bẫy nằm ở B: ''hoàn thiện thể chế, xây dựng nền kinh tế dựa trên nền tảng đổi mới, sáng tạo'' nghe rất hợp lý nhưng nó là đầu mục thứ nhất ngang hàng, không phải nội dung của đầu mục thứ ba mà đề hỏi; A chỉ mô tả đặc điểm kinh tế tri thức, C là quan điểm chung về công nghiệp hóa.'
    tags:
      - phan-ii
      - goc-cau-81
      - phan-xu
  - id: ktct-183
    type: single
    q: Nước nào tiến hành công nghiệp hóa đầu tiên trên thế giới?
    options:
      - Anh
      - Pháp
      - Đức
      - Mỹ
    answer: 0
    why: Anh là nước tiên phong tiến hành công nghiệp hoá đầu tiên trên thế giới, bắt đầu từ cuối thế kỷ 18. Cách mạng công nghiệp lần thứ nhất bắt đầu ở Anh.
    tags:
      - phan-ii
      - goc-cau-82
      - nhat-tri
  - id: ktct-184
    type: single
    q: Chủ trương "đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước" được đề ra ở Đại hội nào của Đảng ta?
    options:
      - Đại hội IX
      - Đại hội VIII
      - Đại hội VI
      - Đại hội VII
    answer: 1
    why: Chủ trương 'đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước' được chính thức đề ra tại Đại hội VIII (1996), khi Đảng xác định nước ta đã kết thúc chặng đường đầu của thời kỳ quá độ và chuyển sang thời kỳ đẩy mạnh công nghiệp hóa, hiện đại hóa. Bẫy là Đại hội VI (1986) - đó là mốc khởi xướng đường lối đổi mới nói chung, chưa phải mốc 'đẩy mạnh công nghiệp hóa, hiện đại hóa'.
    tags:
      - phan-ii
      - goc-cau-83
      - phan-xu
  - id: ktct-196
    type: single
    q: Chọn đáp án sai về vai trò của cách mạng công nghiệp đối với việc thúc đẩy quan hệ sản xuất?
    options:
      - Buộc các nước phải điều chỉnh chế độ sở hữu, thực hiện đa dạng hoá các hình thức sở hữu, lấy sở hữu tư nhân làm nòng cốt, phát huy tối đa sức mạnh và ưu thế của sở hữu nhà nước
      - Tạo cơ hội cho các nước phát triển nhiều ngành kinh tế và những ngành mới thông qua ứng dụng những thành tựu về công nghệ thông tin
      - Việc quản lý quá trình sản xuất của các doanh nghiệp trở lên dễ dàng hơn thông qua ứng dụng các công nghệ như internet
      - Giúp cho việc phân phối và tiêu dùng trở nên dễ dàng và nhanh chóng, thay đổi đời sống của con người
    answer: 0
    why: Câu này yêu cầu chọn đáp án SAI. Phương án A sai vì cách mạng công nghiệp không buộc phải xóa bỏ hoàn toàn tư hữu; các nước tuỳ theo điều kiện điều chỉnh khác nhau.
    tags:
      - phan-ii
      - goc-cau-95
      - nhat-tri
  - id: ktct-197
    type: single
    q: Việc phát triển kinh tế gắn với bảo vệ môi trường là một yêu cầu của?
    options:
      - Tăng trưởng kinh tế nóng
      - Phát triển ngắn hạn
      - Phát triển bền vững
      - Tăng trưởng kinh tế theo chiều rộng
    answer: 2
    why: Việc phát triển kinh tế gắn với bảo vệ môi trường là một yêu cầu của phát triển bền vững, nằm trong lộ trình phát triển của thế giới hiện đại.
    tags:
      - phan-ii
      - goc-cau-96
      - nhat-tri
  - id: ktct-198
    type: single
    q: 'Chọn đáp án đúng nhất: Nội dung tạo lập điều kiện để có thể chuyển đổi từ nền sản xuất - xã hội lạc hậu sang nền sản xuất - xã hội tiến bộ:'
    options:
      - 'Các điều kiện chủ yếu cần có như: tư duy phát triển; môi trường quốc tế thuận lợi và trình độ văn minh của xã hội'
      - 'Các điều kiện chủ yếu cần có như: thể chế và nguồn lực; môi trường quốc tế thuận lợi, ý thức xây dựng xã hội văn minh của người dân'
      - 'Các điều kiện chủ yếu cần có như: tư duy phát triển; thể chế và nguồn lực; môi trường quốc tế thuận lợi và trình độ văn minh của xã hội, ý thức xây dựng xã hội văn minh của người dân'
      - 'Các điều kiện chủ yếu cần có như: tư duy phát triển; môi trường quốc tế thuận lợi và trình độ văn minh của xã hội, ý thức xây dựng xã hội văn minh của người dân'
    answer: 2
    why: 'Các điều kiện cần thiết bao gồm: tư duy phát triển; thể chế và nguồn lực; môi trường quốc tế; trình độ văn minh và ý thức xây dựng xã hội văn minh của người dân.'
    tags:
      - phan-ii
      - goc-cau-97
      - nhat-tri
  - id: ktct-218
    type: single
    q: Trong bối cảnh cách mạng công nghiệp 4.0, giải pháp hoàn thiện thể chế nào sau đây cần được đặc biệt ưu tiên để thúc đẩy phát triển kinh tế số?
    options:
      - Hoàn thiện thể chế về thị trường khoa học, công nghệ, thông tin và quyền sở hữu trí tuệ.
      - Hoàn thiện thể chế về đất đai và bất động sản.
      - Hoàn thiện thể chế thị trường về hội nhập kinh tế quốc tế
      - Hoàn thiện thể chế về quản lý thuế thu nhập cá nhân.
    answer: 0
    why: A đúng vì phát triển kinh tế số trong CMCN 4.0 phụ thuộc trước hết vào thị trường khoa học công nghệ, thông tin và bảo hộ quyền sở hữu trí tuệ - nền tảng cho đổi mới sáng tạo; các phương án còn lại thuộc lĩnh vực khác, không gắn trực tiếp với kinh tế số.
    tags:
      - phan-iii
      - goc-cau-16
      - nhat-tri
  - id: ktct-300
    type: single
    q: Nhiệm vụ nào dưới đây được coi là nhiệm vụ trọng tâm nhằm xây dựng nền kinh tế độc lập, tự chủ, xây dựng cơ sở vật chất cho chủ nghĩa xã hội, giúp Việt Nam đi tắt, đón đầu, tránh nguy cơ tụt hậu xa hơn về kinh tế so với các nước khác?
    options:
      - Đẩy mạnh quan hệ kinh tế đối ngoại và chủ động hội nhập kinh tế quốc tế
      - Kết hợp chặt chẽ kinh tế với quốc phòng, an ninh và đối ngoại trong hội nhập quốc tế
      - Đổi mới, hoàn thiện thể chế kinh tế, hành chính để tăng cường năng lực cạnh tranh của nền kinh tế
      - Đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước
    answer: 3
    why: Công nghiệp hoá, hiện đại hoá là nhiệm vụ trung tâm trong suốt thời kỳ quá độ, giúp xây dựng cơ sở vật chất - kỹ thuật cho chủ nghĩa xã hội, tạo điều kiện để Việt Nam đi tắt, đón đầu và rút ngắn khoảng cách phát triển; các phương án khác chỉ là giải pháp hỗ trợ đi kèm.
    tags:
      - phan-iii
