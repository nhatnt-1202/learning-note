      - nhat-tri
  - id: ktct-043
    type: single
    q: 'Chọn đáp án đúng nhất: Lý do phải hoàn thiện thể thế kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam:'
    options:
      - Do hệ thống pháp luật chưa đầy đủ, còn thiếu và chưa đồng bộ; cơ chế thị trường hiện nay còn kém hiệu quả
      - Do hệ thống thể chế còn kém hiệu lực, hiệu quả, thiếu các yếu tố thị trường và các loại thị trường.
      - Do hệ thống thể chế chưa đầy đủ còn thiếu các yếu tố thị trường
      - Do các cơ chế của nền kinh tế thị trường định hướng xã hội chủ nghĩa còn chưa đồng bộ.
    answer: 1
    why: Lý do phải hoàn thiện thể chế là hệ thống thể chế còn kém hiệu lực, hiệu quả, thiếu các yếu tố thị trường và các loại thị trường. B là lý do toàn diện nhất.
    tags:
      - phan-i
      - goc-cau-43
      - nhat-tri
  - id: ktct-044
    type: single
    q: Thành tựu nổi bật nhất của nền kinh tế thị trường định hướng XHCN ở Việt Nam trong những năm qua là?
    options:
      - Nền kinh tế phát triển năng động, duy trì tốc độ tăng trưởng cao, đời sống nhân dân được cải thiện đáng kể
      - Xóa bỏ hoàn toàn khoảng cách giàu nghèo
      - Trở thành nước có nền công nghiệp nặng hàng đầu thế giới
      - Đạt mức thu nhập cao nhất thế giới
    answer: 0
    why: Thành tựu nổi bật nhất của KTTTĐHXHCN Việt Nam là nền kinh tế phát triển năng động, duy trì tốc độ tăng trưởng cao, đời sống nhân dân được cải thiện đáng kể. B, C, D là khẳng định quá tuyệt đối.
    tags:
      - phan-i
      - goc-cau-44
      - nhat-tri
  - id: ktct-063
    type: single
    q: 'Chọn đáp án đúng nhất: Nhà nước quản lý nền kinh tế thị trường định hướng xã hội chủ nghĩa thông qua:'
    options:
      - Cương lĩnh, đường lối, chủ trương, quyết sách lớn
      - Hệ thống pháp luật, các chiến lược, kế hoạch, quy hoạch và cơ chế, chính sách.
      - Hệ thống pháp luật, các chiến lược, kế hoạch, quy hoạch và cơ chế, chính sách cùng các công cụ kinh tế trên cơ sở tôn trọng các nguyên tắc của thị trường phù hợp với yêu cầu xây dựng xã hội xã hội chủ nghĩa ở Việt Nam.
      - Hệ thống các chiến lược, kế hoạch, quy hoạch và cơ chế, chính sách cùng các công cụ kinh tế.
    answer: 2
    why: Nhà nước quản lý kinh tế thị trường định hướng xã hội chủ nghĩa thông qua hệ thống pháp luật, chiến lược, kế hoạch, cơ chế, chính sách và công cụ kinh tế dựa trên nguyên tắc thị trường. C là câu trả lời đầy đủ nhất.
    tags:
      - phan-i
      - goc-cau-63
      - nhat-tri
  - id: ktct-066
    type: single
    q: 'Chọn đáp án đúng nhất: Mục tiêu của kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam là:'
    options:
      - Góp phần giảm bớt phân hoá giàu nghèo trong xã hội.
      - Thúc đẩy phát triển kinh tế thị trường và hội nhập quốc tế.
      - Xây dựng quan hệ sản xuất tiến bộ, phù hợp nhằm ngày càng hoàn thiện cơ sở kinh tế - xã hội của chủ nghĩa xã hội.
      - Để đẩy mạnh công nghiệp hoá, hiện đại hoá đất nước, phát triển lực lượng sản xuất, nâng cao năng lực cạnh tranh của nền kinh tế.
    answer: 2
    why: Mục tiêu cơ bản là xây dựng quan hệ sản xuất tiến bộ và hoàn thiện cơ sở kinh tế-xã hội của chủ nghĩa xã hội. Các mục tiêu khác (A, B, D) là hệ quả, không phải mục tiêu cơ bản.
    tags:
      - phan-i
      - goc-cau-66
      - nhat-tri
  - id: ktct-072
    type: single
    q: Một trong những nhiệm vụ trọng tâm để hoàn thiện thể chế Kinh tế thị trường định hướng XHCN là 'tạo lập môi trường cạnh tranh bình đẳng, minh bạch'. Điều này có ý nghĩa gì đối với vai trò chủ đạo của kinh tế nhà nước?
    options:
      - Kinh tế nhà nước cần tham gia và kiểm soát hoàn toàn các ngành tài chính và ngân hàng
      - Kinh tế nhà nước phải được ưu tiên hoàn toàn, không cần cạnh tranh
      - Kinh tế nhà nước phải tự chủ kinh doanh, cạnh tranh bình đẳng và chứng minh được vai trò chủ đạo bằng hiệu quả kinh tế.
      - Các quy định về cạnh tranh chỉ áp dụng cho khu vực kinh tế tư nhân
    answer: 2
    why: Tạo môi trường cạnh tranh bình đẳng có nghĩa kinh tế nhà nước phải cạnh tranh bình đẳng và chứng minh vai trò chủ đạo bằng hiệu quả kinh tế, không được ưu tiên nhân tạo.
    tags:
      - phan-i
      - goc-cau-72
      - nhat-tri
  - id: ktct-074
    type: single
    q: 'Chọn đáp án sai về nội dung hoàn thiện thể chế về các mô hình sản xuất kinh doanh:'
    options:
      - Hoàn thiện thể chế về huy động các nguồn lực đầu tư và đổi mới cơ chế quản lý của nhà nước để các đơn vị sự nghiệp công lập phát triển có hiệu quả.
      - Thể chế hoá nội dung và phương thức hoạt động của kinh tế tập thể.
      - Hoàn thiện thể chế quản lý các doanh nghiệp có vốn đầu tư trực tiếp nước ngoài.
      - Thể chế hoá việc cơ cấu lại, đổi mới và nâng cao hiệu quả doanh nghiệp nhà nước.
    answer: 2
    why: 'Đề hỏi đáp án SAI, tức phương án chép lệch so với giáo trình. Bốn nội dung hoàn thiện thể chế về các mô hình sản xuất kinh doanh gồm: cơ cấu lại, đổi mới và nâng cao hiệu quả doanh nghiệp nhà nước; huy động nguồn lực đầu tư và đổi mới cơ chế quản lý để các đơn vị sự nghiệp công lập phát triển hiệu quả; thể chế hoá nội dung và phương thức hoạt động của kinh tế tập thể; và hoàn thiện thể chế THU HÚT đầu tư trực tiếp nước ngoài theo hướng chủ động lựa chọn dự án, công nghệ, quản trị hiện đại. Phương án C đổi ''thu hút đầu tư trực tiếp nước ngoài'' thành ''quản lý các doanh nghiệp có vốn đầu tư trực tiếp nước ngoài'' nên là câu sai. Bẫy là phương án A: đơn vị sự nghiệp công lập nghe như không phải mô hình kinh doanh, nhưng đây đúng là một gạch đầu dòng nguyên văn của giáo trình.'
    tags:
