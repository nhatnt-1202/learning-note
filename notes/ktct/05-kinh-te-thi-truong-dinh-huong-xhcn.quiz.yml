  - id: ktct-037
    type: single
    q: Các chính sách phát triển kinh tế, chính sách thuế, chính sách an sinh xã hội và giáo dục, y tế hiện nay tại Việt Nam thể hiện rõ nhất đặc trưng nào của Kinh tế thị trường định hướng XHCN
    options:
      - Tồn tại nhiều hình thức sở hữu và thành phân kinh tế
      - Tăng trưởng kinh tế gắn với công bằng và tiến bộ xã hội
      - Kinh tế nhà nước giữ vai trò chủ đạo, kinh tế tư nhân là động lực quan trọng của nền kinh tế
      - Thực hiện nhiều hình thức phân phối, chủ yếu phân phối theo lao động và hiệu quả kinh tế
    answer: 1
    why: Các chính sách phát triển kinh tế, thuế, an sinh xã hội, giáo dục y tế thể hiện rõ nhất sự gắn kết tăng trưởng kinh tế với công bằng và tiến bộ xã hội, đặc trưng nền tảng XHCN.
    tags:
