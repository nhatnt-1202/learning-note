questions:
  - id: ktct-010
    type: single
    q: Việc Chính phủ Việt Nam triển khai các gói hỗ trợ phục hồi kinh tế sau đại dịch COVID- 19 thể hiện rõ nhất đặc trưng nào của Kinh tế thị trường định hướng XHCN?
    options:
      - Thực hiện nhiều hình thức phân phối, chủ yếu phân phối theo lao động và hiệu quả kinh tế
      - Tăng trưởng kinh tế gắn với công bằng và tiến bộ xã hội
      - Tồn tại nhiều hình thức sở hữu và thành phân kinh tế
      - Quản lý nền kinh tế có sự điều tiết của Nhà nước xã hội chủ nghĩa
    answer: 3
    why: 'Gói hỗ trợ phục hồi kinh tế là chính sách tài khoá - tiền tệ ở tầm vĩ mô, tức hành vi điều tiết nền kinh tế của Nhà nước để khắc phục cú sốc thị trường, nên thể hiện rõ nhất đặc trưng về quản lý: nền kinh tế có sự quản lý, điều tiết của Nhà nước xã hội chủ nghĩa. Bẫy là phương án B: chữ ''hỗ trợ'' gợi tới an sinh xã hội, nhưng đặc trưng ''tăng trưởng gắn với công bằng và tiến bộ xã hội'' được minh hoạ bằng chính sách xoá đói giảm nghèo, bảo hiểm, phúc lợi, còn ở đây mục tiêu nêu rõ là ''phục hồi kinh tế''. Đối chiếu câu 11 cùng bộ đề cũng thấy đề chấm theo nội dung của hành động, không phải theo việc ai là chủ thể.'
    tags:
      - phan-i
      - goc-cau-10
      - phan-xu
  - id: ktct-011
    type: single
    q: Việc Nhà nước Việt Nam tập trung vào việc tạo lập và phát triển đồng bộ, hiện đại các loại thị trường là một nhiệm vụ nhằm hoàn thiện đặc trưng nào của KTTTĐH XHCN?
    options:
      - Nền kinh tế có nhiều hình thức sở hữu, nhiều thành phần kinh tế
      - Thực hiện nhiều hình thức phân phối, chủ yếu phân phối theo lao động và hiệu quả kinh tế
      - Tồn tại nhiều hình thức sở hữu và thành phân kinh tế
      - Kinh tế thị trường vận hành đầy đủ, đồng bộ theo các quy luật của kinh tế thị trường.
    answer: 3
    why: Tạo lập các loại thị trường đồng bộ, hiện đại là nhiệm vụ hoàn thiện đặc trưng kinh tế thị trường vận hành đầy đủ. A, B, C liên quan đến sở hữu, phân phối chứ không phải vận hành thị trường.
    tags:
      - phan-i
      - goc-cau-11
      - nhat-tri
  - id: ktct-012
    type: single
    q: 'Để khắc phục các khuyết tật của kinh tế thị trường Nhà nước cần:'
    options:
      - Hạn chế hoạt động kinh doanh của khu vực tư nhân trong lĩnh vực ngân hàng
      - Thực hiện sản xuất và cung ứng tất cả các hàng hóa công cộng
      - Xây dựng hệ thống pháp luật, chính sách và cơ chế phù hợp để điều tiết thị trường
      - Quy định giá trần và giá sàn cho tất cả các hàng hóa – dịch vụ
    answer: 2
    why: Để khắc phục khuyết tật của thị trường (thất bại thị trường), nhà nước cần xây dựng hệ thống pháp luật, chính sách và cơ chế điều tiết hợp lý. A, B, D quá cứng nhắc hoặc cực đoan.
    tags:
      - phan-i
      - goc-cau-12
      - nhat-tri
  - id: ktct-014
    type: single
    q: Trọng tâm của thể chế kinh tế thị trường là?
    options:
      - Ngân sách quốc gia
      - Chính sách phát triển kinh tế tư nhân và thúc đẩy đổi mới sáng tạo
      - Luật pháp, hệ thống quy tắc, bộ máy quản lý và cơ chế vận hành
      - Luật giá và chính sách quản lý giá
    answer: 2
    why: Trọng tâm của thể chế kinh tế thị trường là hệ thống pháp luật, bộ máy quản lý và cơ chế vận hành. A liên quan đến tài chính, B, D là những chính sách cụ thể chứ không phải lõi của thể chế.
    tags:
      - phan-i
      - goc-cau-14
      - nhat-tri
  - id: ktct-020
    type: single
    q: Cơ quan lãnh đạo nền kinh tế thị trường định hướng XHCN ở Việt Nam là?
    options:
      - Hội đồng doanh nghiệp
      - Quốc hội
      - Đảng Cộng sản Việt Nam
      - Bộ Công thương
    answer: 2
    why: Đảng Cộng sản Việt Nam là cơ quan lãnh đạo chính của nền kinh tế thị trường định hướng XHCN. Quốc hội là lập pháp, Bộ Công Thương là thực hành, hội đồng doanh nghiệp là tư vấn.
    tags:
      - phan-i
      - goc-cau-20
      - nhat-tri
  - id: ktct-023
    type: single
    q: Thể chế kinh tế thị trường định hướng XHCN là?
    options:
      - Cơ chế thị trường và các chủ thể tham gia thị trường
      - Các chính sách kinh tế của nhà nước
      - Hệ thống pháp luật và bộ máy quản lý nhà nước
      - Hệ thống đường lối, chủ trương chiến lược, luật pháp, chính sách... nhằm hướng đến xác lập đồng bộ các yếu tố thị trường, các loại thị trường hiện đại theo định hướng xã hội chủ nghĩa
    answer: 3
    why: Thể chế kinh tế thị trường định hướng XHCN là hệ thống toàn diện bao gồm đường lối, chủ trương, luật pháp, chính sách nhằm xác lập các yếu tố thị trường theo định hướng xã hội chủ nghĩa. D là định nghĩa đầy đủ nhất.
    tags:
      - phan-i
      - goc-cau-23
      - nhat-tri
  - id: ktct-027
    type: single
    q: Đảng Cộng sản Việt Nam lãnh đạo nền kinh tế thị trường định hướng XHCN thông qua?
    options:
      - Cương lĩnh, pháp luật, kế hoạch, quyết sách, đường lối
      - Cương lĩnh, đường lối, chủ trương, quyết sách lớn
      - Cương lĩnh, đường lối, kế hoạch, chiến lược
      - Cương lĩnh, Luật, Nghị định, chủ trương, quyết sách lớn
    answer: 1
    why: Đảng lãnh đạo kinh tế thông qua cương lĩnh, đường lối, chủ trương và quyết sách lớn. Đây là công thức chuẩn trong tài liệu đảng. A, C, D sắp xếp hay bổ sung không theo chuẩn.
    tags:
      - phan-i
      - goc-cau-27
      - nhat-tri
  - id: ktct-036
    type: single
    q: 'Ở Việt Nam, giá trị đất đai trong mua bán bất động sản là :'
    options:
      - Giá trị quyền sở hữu đất
      - Giá trị lợi thế thương mại
      - Giá trị quyền sử dụng đất
      - Giá trị tiền thuê đất hàng năm
    answer: 2
    why: Ở Việt Nam, người dân chỉ có quyền sử dụng đất, không sở hữu. Do đó giá đất bất động sản là giá trị quyền sử dụng đất. A sai (không có sở hữu đất tư nhân), B, D không đúng.
    tags:
