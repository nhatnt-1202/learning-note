  - id: ktct-081
    type: single
    q: Để khắc phục tình trạng 'chảy máu chất xám' (lao động có trình độ cao rời bỏ Việt Nam), nhiệm vụ trọng tâm nào trong hoàn thiện thể chế thị trường lao động cần được ưu tiên?
    options:
      - Tăng cường kiểm soát sự di chuyển của lao động giữa các vùng miền.
      - Xây dựng các khu công nghiệp mới
      - Đơn giản hóa thủ tục xuất nhập cảnh cho lao động nước ngoài
      - Hoàn thiện thể chế về tiền lương, bảo hiểm xã hội, và các cơ chế tạo động lực, tôn vinh người tài.
    answer: 3
    why: Để khắc phục chảy máu chất xám, cần hoàn thiện thể chế tiền lương, bảo hiểm xã hội và tạo động lực, tôn vinh người tài. D chính xác, A là cách tiếp cận sai lệch.
    tags:
      - phan-i
      - goc-cau-81
      - nhat-tri
  - id: ktct-083
    type: single
    q: 'Chọn đáp án đúng nhất: Nội dung hoàn thiện thế chế phát triển đồng bộ các yếu tố thị trường gồm:'
    options:
      - Hoàn thiện hệ thống thể chế về giá; về thúc đẩy cạnh tranh.
      - Hoàn thiện hệ thống thể chế về giá; về chất lượng hàng hoá, dịch vụ.
      - Hoàn thiện hệ thống thể chế về giá; về thúc đẩy cạnh tranh; về chất lượng hàng hoá, dịch vụ.
      - Hoàn thiện hệ thống thể chế về thúc đẩy cạnh tranh; về chất lượng hàng hoá, dịch vụ.
    answer: 2
    why: 'Phát triển đồng bộ các yếu tố thị trường yêu cầu hoàn thiện ba lĩnh vực: thể chế giá, thúc đẩy cạnh tranh, và chất lượng hàng hóa-dịch vụ. C là câu trả lời đầy đủ.'
    tags:
      - phan-i
      - goc-cau-83
      - nhat-tri
  - id: ktct-085
    type: single
    q: Mục tiêu cơ bản của hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam là?
    options:
      - Thúc đẩy tăng trưởng xuất khẩu và thu hút đầu tư nước ngoài
      - Đảm bảo vai trò chủ đạo của kinh tế nhà nước
      - Thúc đẩy phát triển khu vực kinh tế tư nhân
      - Phát triển kinh tế nhanh, hiệu quả, bền vững, hội nhập quốc tế thành công và giữ vững định hướng xã hội chủ nghĩa.
    answer: 3
    why: Mục tiêu cơ bản là phát triển kinh tế nhanh, hiệu quả, bền vững, hội nhập quốc tế thành công và giữ vững định hướng xã hội chủ nghĩa. D tổng hợp đầy đủ các yếu tố.
    tags:
      - phan-i
      - goc-cau-85
      - nhat-tri
  - id: ktct-088
    type: single
    q: 'Chọn đáp án đúng: Phạm trù: “Kinh tế thị trường định hướng xã hội chủ nghĩa” lần đầu tiên được Đảng Cộng sản Việt Nam nêu ra tại Đại hội lần thứ mấy?'
    options:
      - Đại hội Đảng toàn quốc lần thứ XIII (2021)
      - Đại hội Đảng toàn quốc lần thứ IX (2001)
      - Đại hội Đảng toàn quốc lần thứ XI (2011)
      - Đại hội Đảng toàn quốc lần thứ VII (1991)
    answer: 1
    why: 'Phạm trù ''kinh tế thị trường định hướng xã hội chủ nghĩa'' lần đầu được Đảng chính thức nêu tại Đại hội IX năm 2001, khi xác định đây là mô hình kinh tế tổng quát của thời kỳ quá độ. Bẫy là Đại hội VII (1991): đại hội này thông qua Cương lĩnh và chủ trương phát triển kinh tế hàng hoá nhiều thành phần theo cơ chế thị trường có sự quản lý của Nhà nước, nhưng chưa dùng cụm từ ''định hướng xã hội chủ nghĩa'' cho kinh tế thị trường. Các đại hội XI, XIII chỉ bổ sung, làm rõ nội hàm.'
    tags:
      - phan-i
      - goc-cau-88
      - phan-xu
  - id: ktct-129
    type: single
    q: Trong KTTTĐH XHCN ở Việt Nam, vai trò chủ đạo của kinh tế nhà nước thể hiện rõ nhất thông qua việc nào sau đây?
    options:
      - Khu vực kinh tế nhà nước đảm bảo các cân đối lớn, chi phối các lĩnh vực then chốt, và thúc đẩy phát triển hệ thống an sinh xã hội.
      - Các doanh nghiệp nhà nước đóng góp nhiều nhất cho ngân sách nhà nước
      - Khu vực kinh tế nhà nước kiểm soát hoàn toàn lĩnh vực ngân hàng và tài chính.
      - Kinh tế nhà nước chiếm tỷ trọng lớn nhất trong GDP.
    answer: 0
    why: 'Vai trò chủ đạo của kinh tế nhà nước trong KTTTĐH XHCN Việt Nam thể hiện qua: đảm bảo các cân đối lớn, chi phối lĩnh vực then chốt, và thúc đẩy an sinh xã hội. Đây là định nghĩa chính chính thức.'
    tags:
      - phan-ii
      - goc-cau-28
      - nhat-tri
  - id: ktct-136
    type: single
    q: Tính 'định hướng xã hội chủ nghĩa' của Kinh tế thị trường ở Việt Nam được bảo đảm bằng yếu tố nào là chủ yếu?
    options:
      - Mọi thành phần kinh tế đều được khuyến khích phát triển.
      - Sự ưu tiên tuyệt đối cho khu vực kinh tế tập thể.
      - Tỷ trọng GDP của khu vực kinh tế nhà nước luôn phải đạt trên 50%
      - Sự lãnh đạo của Đảng Cộng sản Việt Nam và vai trò quản lý, điều tiết của Nhà nước xã hội chủ nghĩa.
    answer: 3
    why: Tính 'định hướng xã hội chủ nghĩa' của KTTTĐH Việt Nam được bảo đảm chủ yếu bằng sự lãnh đạo của Đảng Cộng sản Việt Nam và vai trò quản lý, điều tiết của Nhà nước XHCN.
    tags:
      - phan-ii
      - goc-cau-35
      - nhat-tri
  - id: ktct-139
    type: single
    q: Tính 'phát triển bền vững' trong KTTTĐH XHCN ở Việt Nam được hiểu là sự kết hợp hài hòa của các trụ cột nào?
    options:
      - Tăng cường hợp tác quốc tế, mở rộng thị trường xuất khẩu và thu hút đầu tư nước ngoài
      - Tăng trưởng kinh tế và đảm bảo an ninh quốc phòng
      - Ưu tiên phát triển công nghiệp nặng và dịch vụ.
      - Kinh tế tăng trưởng ổn định, xã hội công bằng và môi trường được bảo vệ.
    answer: 3
    why: 'Phát triển bền vững trong KTTTĐH XHCN Việt Nam là sự kết hợp hài hoà của: kinh tế tăng trưởng ổn định, xã hội công bằng, và môi trường được bảo vệ.'
    tags:
      - phan-ii
      - goc-cau-38
      - nhat-tri
  - id: ktct-142
    type: single
    q: Một trong những thách thức của việc xây dựng kinh tế thị trường định hướng XHCN là?
    options:
      - Tăng trưởng kinh tế quá nhanh
      - Thiếu tính cạnh tranh
      - Xử lý mối quan hệ giữa thị trường và nhà nước, tăng trưởng và công bằng xã hội
      - Tình trạng lạm phát cao
    answer: 2
    why: Một thách thức của xây dựng KTTTĐH XHCN là xử lý mối quan hệ giữa thị trường và nhà nước, giữa tăng trưởng kinh tế và công bằng xã hội. Cần cân bằng hai mục tiêu này.
    tags:
      - phan-ii
      - goc-cau-41
      - nhat-tri
  - id: ktct-153
    type: single
    q: Yếu tố nào là mục tiêu lâu dài để phân biệt nền kinh tế Việt Nam với kinh tế thị trường tư bản chủ nghĩa?
    options:
      - Tốc độ tăng trưởng GDP hàng năm
      - 'Mục tiêu hướng tới: ''Dân giàu, nước mạnh, dân chủ, công bằng, văn minh''.'
      - Tốc độ tăng trường của xuất khẩu hàng năm
      - Số lượng các doanh nghiệp tư nhân hoạt động trên thị trường.
    answer: 1
    why: Yếu tố là mục tiêu lâu dài để phân biệt nền kinh tế Việt Nam với KTTTĐH tư bản chủ nghĩa là mục tiêu 'Dân giàu, nước mạnh, dân chủ, công bằng, văn minh' - mục tiêu định hướng xã hội chủ nghĩa.
    tags:
      - phan-ii
      - goc-cau-52
      - nhat-tri
  - id: ktct-157
    type: single
    q: Sự lãnh đạo của Đảng Cộng sản Việt Nam đối với nền kinh tế có tác dụng?
    options:
      - Đảm bảo định hướng XHCN cho sự phát triển kinh tế thị trường
      - Đảm bảo an ninh quốc gia và an toàn kinh tế
      - Đảm bảo tăng trường kinh tế nhanh
      - Bảo vệ độc quyền nhà nước về kinh tế
    answer: 0
    why: Vai trò lãnh đạo của Đảng là đảm bảo định hướng XHCN cho sự phát triển kinh tế thị trường. Đây là đặc trưng cơ bản của kinh tế thị trường định hướng XHCN ở Việt Nam.
    tags:
      - phan-ii
      - goc-cau-56
      - nhat-tri
  - id: ktct-163
    type: single
    q: Tính tất yếu khách quan của việc phát triển kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam được giải thích chủ yếu dựa trên cơ sở nào?
    options:
      - Sự cần thiết phải xóa bỏ hoàn toàn khu vực kinh tế tư nhân để kinh tế nhà nước giữ vai trò tuyệt đối.
      - Yêu cầu của hội nhập kinh tế quốc tế và tuân thủ các cam kết thương mại trong hội nhập kinh tế quốc tế
      - Kinh nghiệm thành công của các nước xã hội chủ nghĩa khác đã chuyển đổi sang kinh tế thị trường.
      - Sự thống nhất giữa tính phổ biến của kinh tế thị trường và các nguyên tắc, mục tiêu cơ bản của chủ nghĩa xã hội.
    answer: 3
    why: Tính tất yếu khách quan của kinh tế thị trường định hướng XHCN được giải thích dựa trên sự thống nhất giữa tính phổ biến của kinh tế thị trường và các nguyên tắc, mục tiêu cơ bản của chủ nghĩa xã hội.
    tags:
      - phan-ii
      - goc-cau-62
      - nhat-tri
  - id: ktct-165
    type: single
    q: Lý do khách quan nào sau đây là quan trọng nhất cho việc áp dụng kinh tế thị trường định hướng xã hội chủ nghĩa tại Việt Nam
    options:
      - Mục tiêu đẩy nhanh tốc độ công nghiệp hóa, hiện đại hóa.
      - Nhu cầu đẩy mạnh cải cách và mở cửa kinh tế
      - Mục tiêu nâng cao hiệu quả hoạt động của khu vực kinh tế nhà nước
      - Xu hướng phát triển khách quan của Việt Nam trong bối cảnh thế giới hiện nay
    answer: 3
    why: Lý do khách quan quan trọng nhất là xu hướng phát triển khách quan của Việt Nam trong bối cảnh thế giới hiện nay. Các yếu tố khác là hệ quả của xu hướng này.
    tags:
      - phan-ii
      - goc-cau-64
      - nhat-tri
  - id: ktct-168
    type: single
    q: 'Sự khác biệt cơ bản giữa kinh tế thị trường định hướng xã hội chủ nghĩa với kinh tế thị trường tư bản chủ nghĩa là:'
    options:
      - Hình thức phân phối thu nhập
      - Vai trò của kinh tế nhà nước
      - Hình thức sở hữu tư liệu sản xuất
      - Vai trò của nhà nước và mục tiêu phát triển
    answer: 3
    why: Sự khác biệt cơ bản giữa hai mô hình kinh tế thị trường nằm ở vai trò của nhà nước và mục tiêu phát triển, không phải hình thức sở hữu (cả hai đều có sở hữu tư nhân).
    tags:
      - phan-ii
      - goc-cau-67
      - nhat-tri
  - id: ktct-171
    type: single
    q: 'Các hình thức sở hữu tư liệu sản xuất hiện nay tại Việt Nam bao gồm:'
    options:
      - Sở hữu nhà nước, sở hữu hợp tác, sở hữu tập thể
      - Sở hữu toàn dân, sở hữu riêng, sở hữu chung
      - Sở hữu nhà nước, sở hữu tư nhân, sở hữu của tổ chức chính trị - xã hội
      - Sở hữu toàn dân, sở hữu tư nhân, sở hữu hỗn hợp
    answer: 3
    why: Theo cách diễn đạt của kinh tế chính trị về sở hữu tư liệu sản xuất trong nền kinh tế thị trường định hướng xã hội chủ nghĩa, các hình thức cơ bản là sở hữu toàn dân, sở hữu tư nhân và sở hữu hỗn hợp (tương ứng nhiều thành phần kinh tế), nên D gần đúng nhất. Bẫy là B - đó là cách phân loại của Bộ luật Dân sự (sở hữu toàn dân, sở hữu riêng, sở hữu chung) về tài sản nói chung, không phải cách trình bày của giáo trình; A và C dùng 'sở hữu nhà nước' thay cho 'sở hữu toàn dân' là sai thuật ngữ. Lưu ý D vẫn thiếu 'sở hữu tập thể' mà giáo trình có nhắc tới.
    tags:
      - phan-ii
      - goc-cau-70
      - phan-xu
      - can-nguoi-doc-lai
  - id: ktct-185
    type: single
    q: Nền kinh tế thị trường định hướng xã hội chủ nghĩa là mô hình tổng quát của?
    options:
      - Chủ nghĩa xã hội
      - Giai đoạn kinh tế tự cung tự cấp
      - Thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam
      - Chủ nghĩa tư bản hiện đại
    answer: 2
    why: Kinh tế thị trường định hướng XHCN là mô hình tổng quát của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam, không phải thời kỳ khác.
    tags:
      - phan-ii
      - goc-cau-84
      - nhat-tri
  - id: ktct-186
    type: single
    q: Tính chất "định hướng xã hội chủ nghĩa" của kinh tế thị trường Việt Nam thể hiện qua việc?
    options:
      - Xóa bỏ tư hữu về tư liệu sản xuất
      - Từ bỏ các quy luật kinh tế thị trường
      - Thực hiện mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh
      - Thực hiện chính sách kinh tế kế hoạch hóa tập trung
    answer: 2
    why: 'Tính chất định hướng XHCN thể hiện qua việc thực hiện mục tiêu: dân giàu, nước mạnh, dân chủ, công bằng, văn minh - các mục tiêu đặc trưng của xã hội chủ nghĩa.'
    tags:
      - phan-ii
      - goc-cau-85
      - nhat-tri
  - id: ktct-187
    type: single
    q: Công cụ điều tiết chủ yếu của nhà nước đối với nền kinh tế thị trường định hướng xã hội chủ nghĩa là?
    options:
      - Chính sách phúc lợi xã hội
      - Luật pháp, chiến lược, quy hoạch, kế hoạch, chính sách kinh tế
      - Công cụ kế hoạch hóa
      - Chính sách tài khóa và chính sách tiền tệ
    answer: 1
    why: Công cụ điều tiết chủ yếu của nhà nước là luật pháp, chiến lược, quy hoạch, kế hoạch, và các chính sách kinh tế. Đây là phương tiện điều tiết macro của nhà nước.
    tags:
      - phan-ii
      - goc-cau-86
      - nhat-tri
  - id: ktct-193
    type: single
    q: 'Mô hình kinh tế khái quát trong thời kỳ quá độ lên chủ nghĩa xã hội ở nước ta là:'
    options:
      - Kinh tế thị trường định hướng xã hội chủ nghĩa
      - Kinh tế kế hoạch hóa tập trung
      - Kinh tế thị trường tự do
      - Kinh tế thị trường xã hội
    answer: 0
    why: Mô hình kinh tế khái quát trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam là kinh tế thị trường định hướng xã hội chủ nghĩa.
    tags:
      - phan-ii
      - goc-cau-92
      - nhat-tri
  - id: ktct-224
    type: single
    q: Vai trò nào sau đây của nhà nước trong nền kinh tế thị trường là quan trọng nhất?
    options:
      - Cung cấp hàng hóa và dịch vụ công cộng
      - Tạo ra lợi nhuận tối đa cho các doanh nghiêp nhà nước
      - Điều tiết thị trường, khắc phục các khuyết tật của kinh tế thị trường và đảm bảo công bằng xã hội
      - Quán lý giả cả
    answer: 2
    why: C đúng vì vai trò quan trọng nhất, bao trùm của nhà nước trong kinh tế thị trường là điều tiết, khắc phục khuyết tật thị trường và bảo đảm công bằng xã hội, chứ không phải trực tiếp kinh doanh kiếm lời hay quản lý giá cả.
    tags:
      - phan-iii
      - goc-cau-22
      - nhat-tri
  - id: ktct-256
    type: single
    q: 'Chức năng thực tiễn của kinh tế chính trị Mác – Lênin là:'
    options:
      - Vận dụng quy luật kinh tế vào phát triển kinh tế - xã hội
      - Phân tích văn hóa tiêu dùng
      - Xây dựng chiến lược marketing
      - Tăng giá trị xuất khẩu
    answer: 0
    why: Chức năng thực tiễn nghĩa là vận dụng những tri thức về quy luật kinh tế vào thực tiễn phát triển kinh tế - xã hội, các phương án B, C, D là hoạt động chuyên môn cụ thể không phải chức năng của một môn khoa học.
    tags:
      - phan-iii
      - goc-cau-54
      - nhat-tri
  - id: ktct-277
    type: single
    q: 'Chức năng tư tưởng của kinh tế chính trị Mác - Lênin là:'
    options:
